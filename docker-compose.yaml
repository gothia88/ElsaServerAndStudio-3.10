services:
  # Custom Elsa 3.10 host: serves Studio + API + workflow HTTP endpoints.
  elsa-server-and-studio:
    image: elsa-server-and-studio-v3-10:latest
    build:
      context: .
      dockerfile: src/Tajan.Workflows.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HTTP_PORTS: 80
      Http__BaseUrl: http://elsa.test.twp.tajan.local
      Http__BasePath: /api/workflows
      ConnectionStrings__Default: ${ELSA_DB_CONNECTION:?set ELSA_DB_CONNECTION}
      # Optional SQL Server application-log sink (ElsaLogDb_Test / dbo.ElsaServerLogs).
      ConnectionStrings__Logs: ${ELSA_LOG_DB_CONNECTION:-}
      AuthServer__BaseUrl: ${AUTH_SERVER_URL:-http://elsa.tajan.local:14000}
      AuthServer__ApplicationId: ${AUTH_SERVER_APP_ID:-A662B524-667F-4AD7-B39F-268C21C9926E}
      AuthServer__ApplicationSecret: ${AUTH_SERVER_APP_SECRET:?set AUTH_SERVER_APP_SECRET}
      Serilog__MinimumLevel__Default: Error
      # Same signing key as the clients; keep it stable.
      Identity__Tokens__SigningKey: ${ELSA_SIGNING_KEY:?set ELSA_SIGNING_KEY}
      # Keep finished instances visible in Studio (matches the old behavior).
      Archive__PurgeMainAfterArchive: "false"
      Archive__AutoCreateTables: "true"
      Plugins__Directory: plugins
    volumes:
      # The identity seed (rahman/admin/alice + Postman app) is gitignored and excluded
      # from the image, so mount it at runtime. It must exist on the server.
      - ./src/Tajan.Workflows.Host/appsettings.Identity.json:/app/appsettings.Identity.json:ro
      # Drop activity plugin DLLs here (Elsa.Activities.Samples.dll, etc.).
      - ./src/Tajan.Workflows.Host/plugins:/app/plugins:ro
    ports:
      - "80:80"

  # Workflow history/auditing API (same DB), as in the old deployment.
  elsa-extensions:
    image: elsa-extensions-v3-10:latest
    build:
      context: .
      dockerfile: src/Tajan.Workflows.Extensions.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HTTP_PORTS: 80
      ConnectionStrings__Default: ${ELSA_DB_CONNECTION:?set ELSA_DB_CONNECTION}
    ports:
      - "16000:80"
    depends_on:
      - elsa-server-and-studio
